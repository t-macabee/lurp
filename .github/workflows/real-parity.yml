name: Real Parity

# Real-solution parity gate on a GitHub-hosted Windows runner.
#
# Runs R1 (five-cycle incremental↔full convergence) on eNoteV2 at the commit
# pinned in parity/targets.json, using the lurp-nupkg artifact that the ci.yml
# run for the dispatched SHA uploaded. eNoteV2 is public, so it is cloned
# with no credentials. The nupkg is installed with
# `dotnet tool install --tool-path` and the R1 script runs it via LURP_CMD;
# scripts/r1-compare is the only project built from source (Release), because
# it is not part of the nupkg.
#
# Fails closed: no successful ci.yml run for the SHA, a missing or expired
# artifact, a SHA-256 mismatch against the recorded SHA256SUMS.txt, or a failed
# R1 run all fail the job.
#
# On success the run attests the nupkg and records a `real-parity` commit
# status carrying the nupkg digest; on failure it records a `failure` status.
#
# Fires only on manual dispatch with the lurp commit SHA whose CI artifact
# should be exercised:
#   gh workflow run real-parity.yml -f sha=<full commit SHA>
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full lurp commit SHA; the ci.yml run for this SHA must have uploaded the lurp-nupkg artifact'
        required: true
        type: string

concurrency:
  # One run per SHA, so a dispatch for another SHA does not cancel this one.
  group: real-parity-${{ inputs.sha }}
  cancel-in-progress: true

jobs:
  real-parity:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      statuses: write   # status on the SHA
      id-token: write   # attestation signing
      attestations: write   # attestation store

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # Single source of truth for the real solution under test: the pinned
      # commit, the repository to clone, and the solution file within it.
      - name: Read pinned eNoteV2 target from parity/targets.json
        shell: pwsh
        run: |
          $target = Get-Content parity/targets.json -Raw | ConvertFrom-Json
          $s = $target.solutions[0]
          if (-not $s) { throw "parity/targets.json lists no solutions." }
          if ($s.sha -notmatch '^[0-9a-fA-F]{40}$') { throw "parity/targets.json: 'sha' is not a full commit SHA." }
          if ($null -eq $s.seed -or $null -eq $s.sample) { throw "parity/targets.json: 'seed' and 'sample' are both required." }
          "enotev2_repo=$($s.repository)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "enotev2_sha=$($s.sha)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "enotev2_path=$($s.path)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "enotev2_solution=$($s.solution)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "enotev2_seed=$($s.seed)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "enotev2_sample=$($s.sample)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          if (-not $s.anchors) { throw "parity/targets.json: 'anchors' is required for the perf baseline gate." }
          @{ anchors = $s.anchors } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP/enotev2-anchors.json"
          Write-Host "Pinned eNoteV2 at $($s.sha) ($($s.repository))"

      # Fail closed unless a successful ci.yml run exists for the dispatched SHA,
      # the lurp-nupkg artifact is present, and its SHA-256 matches the recorded
      # SHA256SUMS.txt.
      - name: Download and verify the CI nupkg
        shell: pwsh
        env:
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          Import-Module ./scripts/ci/LurpCi.psm1 -Force
          $pkg = Get-CiNupkg -Sha $env:SHA -Destination ./artifacts
          "run_id=$($pkg.RunId)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "nupkg_sha256=$($pkg.Digest)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "nupkg_path=$($pkg.Path)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Using ci.yml run $($pkg.RunId) for $env:SHA"
          Write-Host "SHA-256 verified: $($pkg.Digest)"

      - name: Install packed tool
        shell: pwsh
        run: |
          $pkg = Get-ChildItem ./artifacts/*.nupkg | Select-Object -First 1
          $version = $pkg.BaseName -replace '^lurp\.', ''
          if (-not $version) { throw "cannot parse tool version from $($pkg.Name)." }
          dotnet tool install --tool-path ./t --source ./artifacts lurp --version $version
          $exe = "$env:GITHUB_WORKSPACE/t/lurp.exe"
          if (-not (Test-Path $exe)) { throw "installed tool not found at $exe." }
          & $exe --version
          $bashExe = $exe -replace '\\', '/'
          "LURP_CMD=$bashExe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # r1-compare is not part of the nupkg, so it is the only project built
      # from source in this job (Release, as the R1 script expects).
      - name: Build r1-compare (Release)
        shell: pwsh
        run: |
          dotnet build scripts/r1-compare/r1-compare.csproj -c Release
          $exe = "$env:GITHUB_WORKSPACE/scripts/r1-compare/bin/Release/net10.0/r1-compare.exe"
          if (-not (Test-Path $exe)) { throw "r1-compare Release build not found: $exe." }
          $bashExe = $exe -replace '\\', '/'
          "R1_COMPARE_CMD=$bashExe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # eNoteV2 is public: a plain clone needs no credentials.
      - name: Check out eNoteV2 fresh at the pinned SHA (no credentials)
        shell: bash
        run: |
          git clone --no-checkout "$enotev2_repo" "$RUNNER_TEMP/eNoteV2"
          git -C "$RUNNER_TEMP/eNoteV2" checkout --detach "$enotev2_sha"

      - name: R1 convergence on eNoteV2 (pinned SHA, CI nupkg)
        shell: bash
        run: |
          solution_dir="$(cygpath "$RUNNER_TEMP")/eNoteV2/$enotev2_path"
          ./scripts/r1-verify-enote.sh "$solution_dir" "$enotev2_solution"

      # The parity gate is neither in the nupkg nor in Lurp.slnx, so it is built
      # from source (Release) here, like r1-compare. !cancelled() so the two
      # checks below still run (and report) when R1 fails.
      - name: Build parity gate (Release)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          dotnet build scripts/parity/gate/gate.csproj -c Release
          $exe = "$env:GITHUB_WORKSPACE/scripts/parity/gate/bin/Release/net10.0/gate.exe"
          if (-not (Test-Path $exe)) { throw "parity gate Release build not found: $exe." }
          $bashExe = $exe -replace '\\', '/'
          "GATE_CMD=$bashExe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Audit B2: every CLI mode and MCP tool must leave the analyzed tree
      # byte-identical. Runs on the fresh pinned clone (R1 mutates a scratchpad
      # copy, not this tree) with the same CI nupkg as R1.
      - name: Parity integrity on eNoteV2 (fresh clone, CI nupkg)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $solution = Join-Path $env:RUNNER_TEMP "eNoteV2/$env:enotev2_path/$env:enotev2_solution"
          $log = "$env:RUNNER_TEMP/integrity.log"
          # The gate prints nothing on a pass; Tee-Object then creates no file.
          New-Item -ItemType File -Force -Path $log | Out-Null
          & $env:GATE_CMD integrity "--solution=$solution" "--lurp-cmd=$env:LURP_CMD" 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          $added = @(Select-String -Path $log -Pattern '^ADDED ' -ErrorAction SilentlyContinue).Count
          $removed = @(Select-String -Path $log -Pattern '^REMOVED ' -ErrorAction SilentlyContinue).Count
          $changed = @(Select-String -Path $log -Pattern '^CHANGED ' -ErrorAction SilentlyContinue).Count
          $verdict = if ($code -eq 0) { 'pass' } else { 'fail' }
          "integrity: $verdict (added=$added, removed=$removed, changed=$changed, exit=$code)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $code

      # Audit B1 Fixture 3: Oracle B (SymbolFinder) caller recall over a seeded
      # sample of indexed methods, on the same fresh clone and CI nupkg.
      - name: Parity recall on eNoteV2 (fresh clone, CI nupkg)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $solution = Join-Path $env:RUNNER_TEMP "eNoteV2/$env:enotev2_path/$env:enotev2_solution"
          $log = "$env:RUNNER_TEMP/recall.log"
          # The gate prints nothing on a pass; Tee-Object then creates no file.
          New-Item -ItemType File -Force -Path $log | Out-Null
          & $env:GATE_CMD recall "--solution=$solution" "--lurp-cmd=$env:LURP_CMD" "--seed=$env:enotev2_seed" "--sample=$env:enotev2_sample" 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          $counts = (Select-String -Path $log -Pattern '^recall: ' -ErrorAction SilentlyContinue | Select-Object -Last 1).Line
          $verdict = if ($code -eq 0) { 'pass' } else { 'fail' }
          if ($counts) {
            "recall: $verdict $(($counts -replace '^recall: ', '')), exit=$code" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          } else {
            "recall: $verdict (no counts reported, exit=$code)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
          exit $code

      # The run takes 15 to 25 minutes: 8 full index runs and 8 runs of each read
      # on eNoteV2 (a local eNoteV2 full index is about 20 s).
      - name: Perf run on eNoteV2 (fresh clone, CI nupkg)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $solution = Join-Path $env:RUNNER_TEMP "eNoteV2/$env:enotev2_path/$env:enotev2_solution"
          dotnet run --project scripts/perf/harness -c Release -- "--solution=$solution" "--anchors=$env:RUNNER_TEMP/enotev2-anchors.json" "--work=$env:RUNNER_TEMP/perf-work" "--out=$env:RUNNER_TEMP/perf/enotev2.json" --protocol=gate "--lurp-cmd=$env:LURP_CMD"
          if ($LASTEXITCODE -ne 0) { throw "the eNoteV2 perf run failed with exit code $LASTEXITCODE." }

      # Decision 4: the baseline key is ImageOS only, so a weekly ImageVersion
      # change does not fail the gate; a different image only warns.
      # Decision 8: no baseline yet still runs the cap checks and then fails
      # with the commit instruction.
      - name: Baseline perf gate on eNoteV2
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (-not $env:ImageOS) { throw "ImageOS is not set; cannot pick a perf baseline." }
          $candidate = "$env:RUNNER_TEMP/perf/enotev2.json"
          $summary = "$env:RUNNER_TEMP/perf/baseline-summary.md"
          $baseline = "perf/baselines/$env:ImageOS.json"
          $exists = Test-Path $baseline
          if ($exists) {
            dotnet run --project scripts/perf/harness -c Release -- "--baseline=$baseline" "--candidate=$candidate" "--summary=$summary"
          } else {
            dotnet run --project scripts/perf/harness -c Release -- "--baseline=$candidate" "--candidate=$candidate" "--summary=$summary"
          }
          $code = $LASTEXITCODE
          if (Test-Path $summary) { Get-Content $summary -Raw | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
          if (-not $exists) {
            "no perf baseline for runner OS '$env:ImageOS': review enotev2.json from the perf-enotev2 artifact and commit it as perf/baselines/$env:ImageOS.json" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            throw "no perf baseline for runner OS '$env:ImageOS': review enotev2.json from the perf-enotev2 artifact and commit it as perf/baselines/$env:ImageOS.json"
          }
          if ($code -ne 0) { throw "the baseline perf gate failed with exit code $code." }

      - name: Upload eNoteV2 perf result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-enotev2
          path: ${{ runner.temp }}/perf/
          if-no-files-found: warn

      # Ordered after every check, before the success status, so a success status
      # implies the attestation of the same nupkg happened first.
      - name: Attest the CI nupkg
        if: success()
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.nupkg_path }}

      - name: Record the real-parity pass
        if: success()
        shell: pwsh
        env:
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          Import-Module ./scripts/ci/LurpCi.psm1 -Force
          Write-ParityStatus -Repository $env:GITHUB_REPOSITORY -Sha $env:SHA -State success -Description "nupkg sha256=$env:nupkg_sha256" -TargetUrl $env:RUN_URL
          "real-parity: success recorded on $env:SHA (nupkg sha256=$env:nupkg_sha256)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Record the real-parity failure
        if: failure()
        shell: pwsh
        env:
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          Import-Module ./scripts/ci/LurpCi.psm1 -Force
          if (-not (Test-CommitSha $env:SHA)) {
            Write-Host "no status written: input sha is not a full commit SHA"
            exit 0
          }
          Write-ParityStatus -Repository $env:GITHUB_REPOSITORY -Sha $env:SHA -State failure -Description "real-parity failed; see the run" -TargetUrl $env:RUN_URL
