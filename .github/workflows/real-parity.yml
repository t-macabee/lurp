name: Real Parity

# Long-running real-solution parity gate, run against a self-hosted runner
# that has eNoteV2 checked out at a fixed path.
#
# Split out of ci.yml: this job's `runs-on: [self-hosted, real-parity]` has
# no matching runner registered whenever that machine is offline, which
# always resolves as cancelled and was dragging the CI badge red even when
# build/test in ci.yml passed cleanly. Keeping it in its own workflow means
# an unavailable self-hosted runner no longer affects the CI badge — this
# stays what it always was, a post-merge regression backstop, not a gate on
# the actual build/test signal.
#
# Fires only on manual dispatch (`gh workflow run real-parity.yml`); run it
# before a release while the self-hosted runner is online.
#
# It does not run on push to main. With the runner offline, every push run
# ended cancelled and left a red mark on the commit.
on:
  workflow_dispatch:

concurrency:
  group: real-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-parity:
    runs-on: [self-hosted, real-parity]
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The R1 script invokes `dotnet run --no-build` (Debug default) for
      # both Lurp and r1-compare, so Debug artifacts are required — a Release
      # build would fail the first --no-build run. r1-compare is not part of
      # Lurp.slnx, so build both.
      - name: Build Lurp + r1-compare (Debug)
        run: |
          dotnet build src/Lurp.csproj
          dotnet build scripts/r1-compare/r1-compare.csproj

      - name: R1 eNote (eNoteV2)
        shell: bash
        run: ./scripts/r1-verify-enote.sh "C:/Users/Tarik/Desktop/eNoteV2/eNote" "eNote.sln"
