name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: >
          dotnet test tests/Lurp.Storage.Tests.csproj
          --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage;Format=opencover"
          --results-directory ./CoverageResults

      - name: Flake guard (storage suite × 20)
        # Runs the storage suite 20 times and fails the build on ANY single failure.
        # Catches teardown/lifecycle races that appear intermittently (~1 in 15–30 runs).
        shell: pwsh
        run: |
          for ($i = 1; $i -le 20; $i++) {
            dotnet test tests/Lurp.Storage.Tests.csproj --no-build --configuration Release --nologo
            if ($LASTEXITCODE -ne 0) { Write-Error "Flake detected on run $i"; exit 1 }
          }

      - name: Run clean-rebuild equivalence test
        # This test loads MSBuildWorkspace and exercises the real incremental/full
        # indexing paths end-to-end. A failure here blocks the merge.
        run: >
          dotnet test tests/Lurp.Storage.Tests.csproj
          --no-build
          --configuration Release
          --filter "FullyQualifiedName=Lurp.Storage.Tests.CleanRebuildEquivalenceTest.IncrementalIndex_Matches_FullRebuild_AfterSingleFileChange"
          --verbosity normal

      - name: Flatten coverage files for NDepend
        # dotnet test --collect:"XPlat Code Coverage;Format=opencover"
        # writes to CoverageResults/<guid>/coverage.opencover.xml. NDepend's
        # CoverageDir searches non-recursively, so copy the file to
        # TestResults/ root where Lurp.ndproj expects it.
        shell: pwsh
        run: |
          $dest = "./TestResults/coverage.opencover.xml"
          $destFull = Resolve-Path -Path $dest -ErrorAction SilentlyContinue
          $candidates = Get-ChildItem -Path ./CoverageResults -Recurse -Filter "coverage.opencover.xml" |
            Where-Object { $_.FullName -ne $destFull }
          if ($candidates.Count -eq 0) {
            Write-Error "No coverage.opencover.xml found in CoverageResults subdirectories"
            exit 1
          }
          if ($candidates.Count -gt 1) {
            Write-Error "Expected exactly 1 coverage file, found $($candidates.Count): $($candidates.FullName -join ', ')"
            exit 1
          }
          $source = $candidates[0]
          [xml]$xml = Get-Content $source.FullName
          if ($xml.DocumentElement.Name -ne "CoverageSession") {
            Write-Error "Selected coverage file $($source.FullName) root element is '$($xml.DocumentElement.Name)', expected 'CoverageSession'"
            exit 1
          }
          New-Item -ItemType Directory -Path ./TestResults -Force | Out-Null
          Copy-Item -Path $source.FullName -Destination $dest -Force
          Write-Host "Copied $($source.FullName) to $dest"

      - name: Install NDepend
        run: choco install ndepend --no-progress -y

      - name: Run NDepend quality gates
        # Enforcing gate. NDepend compares against the pinned baseline
        # (baselines/Lurp-baseline.ndar) and returns a non-zero exit code when a
        # quality gate fails, because ForceReturnZeroExitCode is False in Lurp.ndproj.
        # A failing gate (e.g. Critical Rules Violated > 0) now blocks the merge.
        shell: pwsh
        run: |
          $ndepend = Resolve-Path "$env:ChocolateyInstall\lib\ndepend\tools\NDepend.Console.exe"
          & $ndepend Lurp.ndproj /Silent
          if ($LASTEXITCODE -ne 0) {
            Write-Error "NDepend quality gate failed (exit code $LASTEXITCODE). See the ndepend-report artifact."
            exit $LASTEXITCODE
          }

      - name: Upload NDepend report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndepend-report
          path: NDependOut/
          if-no-files-found: ignore
