name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref. Superseded runs are cancelled deliberately instead of being
# starved of runners by their successors and cancelled at an arbitrary point.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  # Long-running real-solution parity gate, run against a self-hosted runner
  # that has FIT-RS2-2026 and eNoteV2 checked out at fixed paths.
  #
  # Fires on:
  #   - every push to main (the post-merge regression backstop), and
  #   - pull requests carrying the `real-parity` label (opt-in pre-merge gate
  #     for changes touching incremental indexing, storage, or extractors).
  #
  # The label gate preserves the self-hosted runner as a scarce resource: a
  # maintainer adds `real-parity` only when the change class warrants it.
  # PRs without the label run only the synthetic `build` job above.
  real-parity:
    needs: build
    runs-on: [self-hosted, real-parity]
    timeout-minutes: 30
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'real-parity'))

    steps:
      - uses: actions/checkout@v7

      # The R1 scripts invoke `dotnet run --no-build` (Debug default) and
      # r1-verify-convergence.sh points at bin/Debug/net10.0/r1-compare, so
      # Debug artifacts are required — a Release build would fail the first
      # --no-build run. r1-compare is not part of Lurp.slnx, so build both.
      - name: Build Lurp + r1-compare (Debug)
        run: |
          dotnet build src/Lurp.csproj
          dotnet build scripts/r1-compare/r1-compare.csproj

      - name: R1 convergence (FIT-RS2-2026)
        shell: bash
        run: ./scripts/r1-verify-convergence.sh "C:/Users/Tarik/Desktop/FIT-RS2-2026/eCommerce" "eCommerce.sln"

      - name: R1 eNote (eNoteV2)
        shell: bash
        run: ./scripts/r1-verify-enote.sh "C:/Users/Tarik/Desktop/eNoteV2/eNote" "eNote.sln"
