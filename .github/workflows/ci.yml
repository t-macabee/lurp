name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref. Superseded runs are cancelled deliberately instead of being
# starved of runners by their successors and cancelled at an arbitrary point.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  # The real-solution parity gate (self-hosted runner, FIT-RS2-2026 +
  # eNoteV2) moved to real-parity.yml: a missing/offline self-hosted runner
  # always cancelled that job, which dragged this workflow's — and the
  # README badge's — conclusion red even when build/test passed cleanly.
