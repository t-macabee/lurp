name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref. Superseded runs are cancelled deliberately instead of being
# starved of runners by their successors and cancelled at an arbitrary point.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The unit-test, flake-guard, and clean-rebuild-equivalence steps were
      # removed with the suite: commit f1254fc deleted tests/Lurp.Tests.csproj.
      # Restore them when the test project is rebuilt.
