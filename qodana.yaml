version: "1.0"
#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file             #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html          #
#-------------------------------------------------------------------------------#
linter: jetbrains/qodana-dotnet:latest
bootstrap: dotnet restore Lurp.slnx
# Without an explicit profile, Qodana falls back to the project's own
# .idea/inspectionProfiles/Project_Default.xml (a ~400-rule IDE profile with
# no path-scoping), which made every include/exclude entry below inert.
# "empty" makes this file's include/exclude list the actual source of truth.
profile:
  name: empty
include:
  - name: csharp_injection_rule-CommandInjection
  - name: csharp_injection_rule-SQLInjection
  - name: ConvertIfStatementToReturnStatement
  - name: ConvertIfStatementToConditionalTernaryExpression
  - name: SeparateLocalFunctionsWithJumpStatement
  - name: AutoPropertyCanBeMadeGetOnly.Global
  - name: CanReplaceCastWithLambdaReturnType
  - name: ConvertIfStatementToSwitchStatement
  - name: ConvertToPrimaryConstructor
  - name: ConvertToLocalFunction
  - name: UseAwaitUsing
  - name: ConvertToUsingDeclaration
  - name: ConvertToStaticClass
  - name: ConvertClosureToMethodGroup
  - name: ConvertToConstant.Local
  - name: CanSimplifyDictionaryTryGetValueWithGetValueOrDefault
  - name: ForeachCanBeConvertedToQueryUsingAnotherGetEnumerator
  - name: InvertIf
  - name: JoinNullCheckWithUsage
  - name: JoinDeclarationAndInitializer
  - name: UseVerbatimString
  - name: LoopCanBeConvertedToQuery
  - name: MemberCanBePrivate.Global
  - name: MemberCanBeProtected.Global
  - name: MemberCanBeMadeStatic.Local
  - name: MergeConditionalExpression
  - name: MergeIntoPattern
  - name: MergeIntoLogicalPattern
  - name: MethodHasAsyncOverload
  - name: UnusedMethodReturnValue.Global
  - name: ForeachCanBePartlyConvertedToQueryUsingAnotherGetEnumerator
  - name: PreferConcreteValueOverDefault
  - name: RedundantTypeDeclarationBody
  - name: RedundantVerbatimStringPrefix
  - name: ReplaceWithFieldKeyword
  - name: ReplaceWithPrimaryConstructorParameter
  - name: CA1822
  - name: CA1510
  - name: CA1859
  - name: SwitchStatementHandlesSomeKnownEnumValuesWithDefault
  - name: RedundantAlwaysMatchSubpattern
  - name: UnusedMemberInSuper.Global
  - name: UnusedMember.Global
  - name: UnusedParameter.Global
  - name: UseNameOfInsteadOfToString
  - name: UseCollectionExpression
  - name: SimplifyStringInterpolation
  - name: UseRawString
  - name: UseUtf8StringLiteral

# Reviewed 2026-08-16: interpolated CommandText/ArgumentList values at these sites are
# compile-time literals or internally-generated paths, never external input, so the
# scanner's taint model produces false positives here. See inline comments at each site.
exclude:
  - name: csharp_injection_rule-CommandInjection
    paths:
      - tests/IntegrationTestBase.cs
  - name: csharp_injection_rule-SQLInjection
    paths:
      - src/Storage/Migrations/Migration_008_GeneratedCodeAwareness.cs
      - src/Storage/SnapshotPruner.cs
